[build]
# The build checks the types, applies the database migrations, seeds the interest rates and
# builds the web app (Vite).
command = "npm run build"
# The web app's build output. Without a publish folder Netlify would publish the repository root.
publish = "web/dist"

[functions]
# pdfkit reads its standard-font data at runtime through createRequire and a "#standard-fonts/*" import
# map. Inlined into the esbuild bundle that breaks ("Cannot find module '#standard-fonts/Helvetica'", so
# the PDF endpoint answers 500). As an external module it is shipped, with its own dependencies, next to
# the bundle. Verified on a deployed build: the PDF endpoint answers 200 with a real PDF.
external_node_modules = ["pdfkit"]

# Files that do not exist must not answer 200 with the app's HTML.
[[redirects]]
from = "/sitemap.xml"
to = "/404.html"
status = 404

# Single-page app: any path that is not a file serves the app, which then shows its own 404 page.
# The API function declares its own path (/api/*) and this rule does not capture it: verified on the
# deployed URL, where GET /api/health answers JSON and an unknown /api path answers the API's JSON 404.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
  [headers.values]
  # No inline scripts or styles anywhere: the app ships one script, one stylesheet and its own fonts.
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Cross-Origin-Opener-Policy = "same-origin"
  Cross-Origin-Resource-Policy = "same-origin"
  X-Frame-Options = "DENY"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Vite puts a content hash in every file name under /assets, so they never change.
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
