[build]
# The build checks the types and applies the database migrations (plan section 9, T07).
command = "npm run build"
# Without a publish folder Netlify would publish the repository root.
publish = "public"

[functions]
# pdfkit reads its standard-font data at runtime through createRequire and a "#standard-fonts/*" import
# map. Inlined into the esbuild bundle that breaks ("Cannot find module '#standard-fonts/Helvetica'", so
# the PDF endpoint answers 500). As an external module it is shipped, with its own dependencies, next to
# the bundle. Checked only with a local esbuild emulation: the day-3 deployment check (T07) must prove it.
external_node_modules = ["pdfkit"]
