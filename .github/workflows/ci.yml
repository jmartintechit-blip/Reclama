name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run web:build
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Verify interest rate table
        run: npm run rates:verify
      # Real browser (the Chrome preinstalled on the runner) against the in-memory API: no database needed.
      - name: End-to-end demo flow
        run: npm run e2e
      # Gate: a high or critical advisory in production dependencies fails the build.
      # If a registry hiccup fails it, re-run the job; a known unfixable advisory goes in docs, not here.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
