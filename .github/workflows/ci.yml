name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      # To add with their tasks (plan section 8): rates:verify (T11) and the web build (T28).
      # Warning only (plan section 8): a registry hiccup or a new advisory must not block merges.
      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true
